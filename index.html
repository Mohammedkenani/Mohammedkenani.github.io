<!DOCTYPE html>
<html lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>حِكمي</title>
<style>
body{background:#0f0f0f;color:#fff;font-family:system-ui;direction:rtl;text-align:center;padding:30px}
.container{max-width:700px;margin:auto}.card{background:#1c1c1c;padding:20px;margin:15px 0;border-radius:14px;line-height:1.9;font-size:18px;white-space:pre-line}
button{margin-top:20px;padding:12px 20px;border:none;border-radius:10px;background:#fff;color:#000;cursor:pointer}
</style></head><body><h1>📖 حكم اليوم</h1><div class="container" id="quotesBox"></div><button onclick="generateQuotes()">🔄 حكمة جديدة</button>
<script>
const quotes=[
`ارضاء الناس أجمعين مستحيل ولكن إرضاء ذاتك هو خيار`,`عامل نفسك كأنك شخص آخر أنت مسؤول عن مساعدته`,`الندم على اتخاذ القرار الخطأ أهون من عدم اتخاذ أي قرار`,`أخرج من دائرة الراحة، الكسل هو العدو الأول`,`اللحظة التي تتردد فيها لأن الخطوة مخيفة هي اللحظة التي يجب أن تتقدم فيها`,`لا تستهين بالفائدة المركبة للعادات على المدى البعيد`,`الانتكاسات طبيعية، النجاح هو الاستمرار بالمحاولة`,`على المدى الطويل جودة حياتنا تعتمد على جودة عاداتنا`,`شغلك وعاداتك اليوم هي مستقبلك`,`الجميع يحترم قوة المحارب ولو كان العدو`,`لا تشغل نفسك بالمستقبل أو الماضي، ركز على يومك`,`دماغك يتأثر بما حولك فاختر مدخلاتك بعناية`,`التعليم الذاتي ومهارة البحث لا يستهان بهما`,`بعد سنوات ستتعب لاستعادة صحة اليوم فلا تهملها`,`كل صعوبة فرصة لتطوير نفسك`,`الراحة بلا تعب لا معنى لها`,`أنت تعيش إحدى أفضل فترات حياتك الآن`,`المرء نتيجة خلوته`,`الحياة تتحسن بعادات صغيرة يومية`,`اهتم بدائرتك فقط`,`قدم أفضل ما لديك اليوم`,`الإنسان يحصر نفسه في تجارب متكررة ثم يشتكي ضيق الحياة`,`ادخل كل مكان وكأنك تملكه بثقة`,`توقف عن منح الآخرين القوة للتحكم في سعادتك`,`أعظم نعمة في الحياة العائلة`,`لا أحد يتجاوز حدوده دون سماحك`,`ما تمارسه يوميًا سوف تتقنه`,`العقل ينمو بالتعرض لأفكار أعمق`,`تعلم السيطرة على أفكارك`,`من لا يقود نفسه سيبقى منقادًا`,`الأهم بينك وبين نفسك لا بينك وبين الناس`,`فقر الأفكار سببه قلة الاطلاع`,`الخوف يدفع كثيرًا لإرضاء الآخرين`,`لا تطلب حقك باستحياء`,`لا تجامل على حساب صحتك وكرامتك`,`الحياة اختيار والسعادة اختيار`,`الناس أقل اهتمامًا بتفاصيلك مما تظن`,`كلمة لا كافية`,`الكمال مقبرة الإنجاز`,`قاعدة الخمس دقائق: أنجزه فورًا`,`اشترِ الذكريات لا الأشياء`,`لا توجد لحظة مثالية، انتهز الفرص`,`لا تقارن، المقارنة مقبرة السعادة`,`الله عز وجل الركن الأساسي في حياتك`,`لا تحاول كثيرًا مع الناس`,`أسس عادات إيجابية والتزم بها`,`استمع أكثر، فالناس مرت بما تمر به`,`ابتعد عن الناس التعيسة`,`اكتب الفكرة فورًا ونفذها إن استطعت`,`لا تؤجل السعادة`,`اندماجك في عملك مع الذكاء يصنع الفرق`,`ركز على مواطن قوتك`,`اللهم لك الحمد والشكر دائمًا وأبدًا`,`لا تنس عيش اللحظة يا محمد`,
`وعاجز الرأي مضياع لفرصته
حتى اذا فات امراً عاتب القدر`,`مالا يدرك كُله لايترك جُله`,`ماتفعله بمفردك هو مايصنعك`,`احذر ايه المتردد ان تحيئ على قناعات الاخرين`,`اخرج من هذه الدنيا بذكريات لا احلام`,`اي شي بإمكانك فعله افعله بنفسك ولاتعتمد على الاخرين
هذا يزيد من قيمتك بطريقة غير مباشرة`,`انت متوسط خمسة من اصدقائك فأختار جلسائك بعناية`,`ارمي الكلمه الطيبه ولاتكترث لها`,`الاستمرارية اهم من الكمية`,`بين انتظار المستقبل وفقدان الماضي يضيع الحاضر الذي هو الوقت الوحيد الذي تستطيع التغيير فيه`,`المشاكل هي فرصة لتعلم لاتهرب منها!`,`استمتع بالحياة والضغوطات جزء من الحياة`,`لاتؤجل الاستمتاع بالرحلة لأجل انتظار شيء`,`الاعذار تسهل حياتك اليوم وتصعبها غداً`,`اذا استمديت سعادتك من الخارج ، الخارج نفسه راح يعطيك نفس الشعور مثل مايعطيك سعادة يعطيك حزن`,`من تتبع خفيات العيوب ، حُرم مودات القلوب`,`السفن تغرق عندما يدخل الماء داخلها وكذلك الانسان عندما تدخل الافكار السلبيه لداخله`,`مايعرفه الناس عنك هو ظن وماتعرفه عن نفسك هو يقين فلا تجعل ظنونهم تفوق يقينك`,`انْسَ الماضي بما فيه، فالاهتمامُ بما مضى وانتهى حُمّقٌ وجنونٌ.`,`الإيمانُ باللهِ، والعملُ الصالحُ هو الحياةُ الطيبةُ السعيدةُ.`,`على العبدِ أنْ يعلمَ أنّ كلَّ شيءٍ بقضاء وقَدَرٍ.`,`فكِّرْ في النعمِ واشكرْ.`,`Happiness depends on your attitude, not on what you have.`,`If you can see beauty
even in simple things of life then a beautiful day will rise`];
function getRandom(a,n){let s=[...a].sort(()=>0.5-Math.random());return s.slice(0,n)}
function generateQuotes(){let b=document.getElementById('quotesBox');b.innerHTML='';getRandom(quotes,4).forEach(q=>{let d=document.createElement('div');d.className='card';d.textContent=q;b.appendChild(d);});}
generateQuotes();
</script></body></html>
